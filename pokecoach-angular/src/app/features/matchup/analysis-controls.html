<div class="tw:flex tw:flex-col tw:gap-2 tw:border tw:border-base-300 tw:rounded-box tw:p-3 tw:mt-1">
  <div class="tw:flex tw:flex-wrap tw:items-center tw:gap-3">
    <button
      type="button"
      class="tw:btn tw:btn-primary tw:btn-sm"
      [disabled]="!canStart()"
      (click)="launch()"
    >
      @if (busy()) {
        {{ 'analysis.launching' | transloco }}
      } @else {
        {{ 'analysis.analyze' | transloco }}
      }
    </button>
    @if (canCancel()) {
      <button
        type="button"
        class="tw:btn tw:btn-ghost tw:btn-sm"
        [disabled]="busy()"
        (click)="cancelRun()"
      >
        {{ 'common.cancel' | transloco }}
      </button>
    }
    @if (busy()) {
      <span class="tw:loading tw:loading-spinner tw:loading-sm" aria-hidden="true"></span>
    } @else if (progressBar(); as bar) {
      <progress
        class="tw:progress tw:progress-primary tw:w-40 tw:max-w-full"
        role="progressbar"
        [value]="bar.completed"
        [max]="bar.total"
        [attr.aria-valuenow]="bar.completed"
        [attr.aria-valuemax]="bar.total"
      ></progress>
    }
  </div>
  @if (progressHint(); as hint) {
    <p class="tw:text-xs tw:text-base-content/60 tw:m-0" role="status">{{ hint }}</p>
  }
  <p class="tw:text-sm tw:text-base-content/70 tw:m-0">{{ helperText() }}</p>
  @if (error(); as err) {
    <p class="tw:text-sm tw:text-error tw:m-0" role="alert">{{ err }}</p>
  }
</div>
