<div class="tw:flex tw:flex-col tw:gap-2 tw:border tw:border-base-300 tw:rounded-box tw:p-3">
  <div class="tw:flex tw:flex-wrap tw:items-center tw:gap-3">
    <button
      type="button"
      class="tw:btn tw:btn-primary tw:btn-sm"
      [disabled]="!canStart()"
      (click)="launch()"
    >
      @if (busy()) {
        Lancement…
      } @else {
        Analyser ce matchup
      }
    </button>
    @if (canContinue()) {
      <button
        type="button"
        class="tw:btn tw:btn-outline tw:btn-sm"
        [disabled]="busy()"
        (click)="continueRun()"
      >
        Continuer l’analyse
      </button>
    }
    @if (canCancel()) {
      <button
        type="button"
        class="tw:btn tw:btn-ghost tw:btn-sm"
        [disabled]="busy()"
        (click)="cancelRun()"
      >
        Annuler
      </button>
    }
  </div>
  <p class="tw:text-sm tw:text-base-content/70 tw:m-0">{{ helperText() }}</p>
  @if (error(); as err) {
    <p class="tw:text-sm tw:text-error tw:m-0" role="alert">{{ err }}</p>
  }
</div>
